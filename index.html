
<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050816">
<title>ONEVYO — Your All-in-One World</title>

<style>
:root{
  --bg:#050816;
  --panel:#0c1225;
  --panel2:#111a33;
  --text:#f7f8ff;
  --muted:#98a5c4;
  --line:#263457;
  --blue:#38bdf8;
  --purple:#8b5cf6;
  --green:#43e6b1;
}

*{box-sizing:border-box}

body{
  margin:0;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  background:
  radial-gradient(circle at 50% -10%, rgba(56,189,248,.30) 0%, rgba(56,189,248,.08) 25%, transparent 46%),
  radial-gradient(circle at 15% 100%, rgba(139,92,246,.28) 0%, transparent 40%),
  radial-gradient(circle at 85% 90%, rgba(37,99,235,.20) 0%, transparent 36%),
  linear-gradient(180deg,#061226 0%,#050816 52%,#02030a 100%);
background-attachment:fixed;
    
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(5,8,22,.86);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:900;
  letter-spacing:1px;
}

.logo{
  width:34px;
  height:34px;
  border-radius:50%;
  border:4px solid var(--blue);
  border-right-color:var(--purple);
  border-bottom-color:transparent;
  transform:rotate(-20deg);
  box-shadow:0 0 24px rgba(91,115,255,.7);
}

.online{
  color:var(--green);
  font-size:12px;
  font-weight:800;
}

.wrap{
  max-width:960px;
  margin:auto;
  padding:18px;
}

.hero{
  text-align:center;
  padding:34px 10px 20px;
}

.earth{
  width:190px;
  height:190px;
  margin:5px auto 25px;
  border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%,#d7fbff 0 2%,transparent 3%),
    radial-gradient(circle at 35% 35%,#4fc3f7 0 20%,#1674c6 40%,#082d68 70%);
  box-shadow:
    inset -28px -25px 45px rgba(0,0,0,.5),
    0 0 55px rgba(56,189,248,.35),
    0 0 100px rgba(139,92,246,.18);
  position:relative;
  overflow:hidden;
}

.earth:before,
.earth:after{
  content:"";
  position:absolute;
  background:#5ac87a;
  opacity:.9;
  border-radius:48% 52% 55% 45%;
}

.earth:before{
  width:80px;height:55px;
  left:26px;top:45px;
  transform:rotate(-18deg);
}

.earth:after{
  width:68px;height:80px;
  right:25px;top:78px;
  transform:rotate(22deg);
}

h1{
  margin:0;
  font-size:48px;
  line-height:1;
  letter-spacing:-2px;
}

.gradient{
  background:linear-gradient(90deg,var(--blue),#6f7bff,var(--purple));
  -webkit-background-clip:text;
  color:transparent;
}

.slogan{
  margin:13px 0 6px;
  font-size:20px;
  font-weight:800;
}

.muted{
  color:var(--muted);
  line-height:1.55;
}

nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:8px 0 18px;
  scrollbar-width:none;
}

button{
  border:1px solid var(--line);
  color:white;
  background:rgba(17,26,51,.88);
  border-radius:13px;
  padding:11px 14px;
  font-weight:800;
  cursor:pointer;
}
